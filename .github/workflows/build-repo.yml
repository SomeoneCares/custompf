name: Build pkg Repository

on:
  push:
    branches: [ master ]
    paths:
      - 'sources/**'
      - 'scripts/build_pkg.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build packages and repository catalog
        run: |
          mkdir -p /tmp/pkg-build/staging
          mkdir -p /tmp/pkg-build/packages/All

          # Copy staging files from sources
          cp -r sources/net/pfSense-pkg-flexiwan/FlexiWAN*.php /tmp/pkg-build/staging/ 2>/dev/null || true

          # Run the build script
          python3 scripts/build_pkg.py

      - name: Copy artifacts to docs/
        run: |
          cp /tmp/pkg-build/packages/All/*.pkg       docs/All/
          cp /tmp/pkg-build/packages/packagesite.pkg  docs/
          cp /tmp/pkg-build/packages/packagesite.yaml docs/
          cp /tmp/pkg-build/packages/meta.conf        docs/
          cp /tmp/pkg-build/packages/meta             docs/
          cp /tmp/pkg-build/packages/digests.txz      docs/

      - name: Commit updated repository artifacts
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Auto-rebuild repository catalog [skip ci]"
          git push
